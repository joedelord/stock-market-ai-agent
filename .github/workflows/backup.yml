name: Database backup

# A daily pg_dump of the production database, kept outside Railway. Railway's
# own volume backups need the Pro plan and are deleted with the volume.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL  Railway Postgres DATABASE_PUBLIC_URL + ?sslmode=require
#   BACKUP_PASSPHRASE    Long random passphrase. The repository is public and
#                        so are its artifacts, so every dump is encrypted.
#                        Keep a copy outside GitHub: without it no backup can
#                        be restored.

on:
  schedule:
    # 04:30 UTC, after the scheduler's 03:00 cleanup and outside market hours.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

    steps:
      - name: Check the secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets"
            exit 1
          fi

      # pg_dump refuses to dump a newer server, so the image follows the
      # server's major version.
      - name: Find the PostgreSQL version
        run: |
          version=$(docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -c 'psql "$DATABASE_URL" -tAc "SHOW server_version_num"')
          echo "PG_MAJOR=$((version / 10000))" >> "$GITHUB_ENV"
          echo "BACKUP_NAME=database-$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Dump the database
        run: |
          docker run --rm -e DATABASE_URL "postgres:${PG_MAJOR}-alpine" \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges' \
            > backup.dump

      # A dump that cannot be restored is not a backup. Row counts are not
      # printed, because the workflow logs are public.
      - name: Check that the dump restores
        run: |
          docker run -d --name restore -e POSTGRES_PASSWORD=postgres "postgres:${PG_MAJOR}-alpine"
          for attempt in $(seq 1 30); do
            if docker exec restore pg_isready -h 127.0.0.1 -U postgres > /dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              exit 1
            fi
            sleep 1
          done
          docker exec -i restore pg_restore -U postgres -d postgres --exit-on-error < backup.dump
          docker exec restore psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM users LIMIT 1; SELECT 1 FROM migrations LIMIT 1;" > /dev/null
          docker rm -f restore

      - name: Encrypt the dump
        run: |
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$BACKUP_NAME.dump.gpg" backup.dump
          rm backup.dump

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
