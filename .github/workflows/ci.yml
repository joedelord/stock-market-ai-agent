name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_market_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # config/env.js reads these when server/.env.test does not exist.
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: stock_market_test_db
      JWT_SECRET: ci-test-secret-only-for-tests
      JWT_EXPIRES_IN: 1h
      COOKIE_EXPIRES_IN_MS: 3600000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Production dependencies only: dev tools never reach the image.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run migrate
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Builds the production image and starts it against a real database, so a
  # file missing from the image or a failing production startup check breaks
  # CI instead of a deploy.
  docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_market_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values that pass the production startup checks. Email is not
    # reachable, which only logs a warning at startup.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stock_market_db
      JWT_SECRET: ci-smoke-test-jwt-secret-not-for-production-use
      UNSUBSCRIBE_SECRET: ci-smoke-test-unsubscribe-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:5000
      MAIL_FROM: ci@example.com
      SMTP_HOST: localhost

    steps:
      - uses: actions/checkout@v7
      - run: docker build -t stock-market-ai-agent .

      # Host networking lets the containers reach the Postgres service port.
      - name: Run migrations in the image
        run: >-
          docker run --rm --network host
          -e DATABASE_URL -e JWT_SECRET -e UNSUBSCRIBE_SECRET
          -e CLIENT_ORIGIN -e MAIL_FROM -e SMTP_HOST
          stock-market-ai-agent npm run migrate

      - name: Start the server
        run: >-
          docker run -d --name app --network host
          -e DATABASE_URL -e JWT_SECRET -e UNSUBSCRIBE_SECRET
          -e CLIENT_ORIGIN -e MAIL_FROM -e SMTP_HOST
          stock-market-ai-agent

      - name: Check the health endpoint and the built client
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:5000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:5000/stocks | grep -q '<div id="root">'

      - name: Show server logs
        if: always()
        run: docker logs app || true
